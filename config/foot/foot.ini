# ~/.config/foot/foot.ini - Shh... dotfiles
# black and white, like the rest: shades of gray, red only for errors.
# every desktop uses foot, so this lives in config/, not in desktops/
# check after editing: foot --check-config

[main]
# the nerd font has the icons used by the prompt and fastfetch
font=JetBrainsMono Nerd Font:size=12
# 8 px of empty space around the text
pad=8x8

[cursor]
style=block
blink=no

# foot 1.28 calls the main theme colors-dark (the old name was [colors])
[colors-dark]
background=000000
foreground=e6e6e6

# the cursor: black text on a white block
cursor=000000 e6e6e6
# selected text is inverted: black on white
selection-foreground=000000
selection-background=e6e6e6

# the 16 terminal colors. programs ask for "green", "blue" ...,
# we hand out grays instead; only red stays red
# black is dark gray, so black text is still visible on the black background
regular0=2a2a2a
regular1=d7263d
regular2=b4b4b4
regular3=d0d0d0
regular4=8c8c8c
regular5=a0a0a0
regular6=c0c0c0
regular7=e6e6e6

bright0=5a5a5a
bright1=ff4d5e
bright2=c8c8c8
bright3=e0e0e0
bright4=a8a8a8
bright5=b8b8b8
bright6=d4d4d4
bright7=ffffff
