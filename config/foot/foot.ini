# ~/.config/foot/foot.ini - the terminal
# check after editing: foot --check-config

[main]
font=JetBrainsMono Nerd Font:size=12
# space around the text in px
pad=8x8

[cursor]
style=block
blink=no

[colors-dark]
background=000000
foreground=e6e6e6

cursor=000000 e6e6e6
selection-foreground=000000
selection-background=e6e6e6

# the 16 terminal colors: grays instead of green, blue ...; only red stays red.
# other configs use these numbers (0-7 regular, 8-15 bright)
regular0=2a2a2a
regular1=d7263d
regular2=b4b4b4
regular3=d0d0d0
regular4=8c8c8c
regular5=a0a0a0
regular6=c0c0c0
regular7=e6e6e6

bright0=5a5a5a
bright1=ff4d5e
bright2=c8c8c8
bright3=e0e0e0
bright4=a8a8a8
bright5=b8b8b8
bright6=d4d4d4
bright7=ffffff
